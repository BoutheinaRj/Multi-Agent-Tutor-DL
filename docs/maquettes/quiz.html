<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette D2 — Page Quiz</title>
<link rel="stylesheet" href="maquettes.css">
</head>
<body>
<!-- D2 — Maquette de la page Quiz (pour Ali, A5) : une question à la fois, feedback immédiat,
     score final, mode flashcards. Données d'exemple tirées du cours ml_gradient_stochastique_esprit_fr. -->
<header class="barre">
  <span class="logo">Multi-Agent Tutor</span>
  <span class="titre-cours">Optimisation pour le ML — Ch. 3 Descente de gradient stochastique</span>
  <nav class="onglets">
    <a href="cours.html">Cours</a>
    <a href="quiz.html" class="actif">Quiz</a>
  </nav>
</header>

<main class="page-quiz">
  <div class="entete-quiz">
    <strong id="compteur">Question 1 / 3</strong>
    <span class="etiquette" id="bloom">Comprendre</span>
    <div class="modes niveaux" role="group" aria-label="Mode">
      <button data-mode="qcm" class="actif">QCM</button>
      <button data-mode="flashcards">Flashcards</button>
    </div>
  </div>
  <div class="progression"><div id="barre" style="width:0%"></div></div>

  <!-- Mode QCM : une question à la fois, feedback immédiat -->
  <section class="carte question" id="qcm">
    <h2 id="enonce"></h2>
    <div class="choix" id="choix"></div>
    <div class="feedback" id="feedback"></div>
    <div class="pied-quiz">
      <span class="note" id="source"></span>
      <button class="bouton primaire" id="suivant" disabled>Question suivante →</button>
    </div>
  </section>

  <!-- Score final -->
  <section class="carte score" id="score">
    <p>Score final</p>
    <div class="valeur" id="valeur"></div>
    <p class="note">Questions à revoir :</p>
    <ul id="revoir"></ul>
    <div><button class="bouton" id="recommencer">Recommencer</button> <button class="bouton primaire">Exporter vers Anki</button></div>
  </section>

  <!-- Mode flashcards : recto / verso, auto-évaluation (SM-2, A6) -->
  <section class="flashcards" id="flashcards">
    <div class="carte flashcard" id="carte" title="Cliquer pour retourner">
      <div><span class="face" id="face">Recto</span><span id="contenu"></span></div>
    </div>
    <p class="note">Cliquez sur la carte pour la retourner.</p>
    <div class="evaluation">
      <button class="bouton">À revoir</button>
      <button class="bouton">Difficile</button>
      <button class="bouton">Bien</button>
      <button class="bouton primaire">Facile</button>
    </div>
    <p class="note" id="compteur-cartes"></p>
  </section>
</main>

<script>
  // Format proche de la sortie de l'agent Quiz (A2) : question, choix, bonne réponse, explication, niveau de Bloom, slide.
  const questions = [
    { enonce: "Qu'est-ce qu'une époque (epoch) ?", bloom: "Mémoriser", slide: 3,
      choix: ["Une mise à jour des paramètres", "Un passage complet sur les N données", "Le choix du pas ρ", "Un tirage aléatoire d'une donnée"],
      bonne: 1, explication: "Une itération est une mise à jour ; une époque est un passage complet sur les N données." },
    { enonce: "Pourquoi la descente stochastique à pas constant oscille-t-elle autour du minimiseur X* ?", bloom: "Comprendre", slide: 7,
      choix: ["Parce que ∇E(X*) ≠ 0", "Parce que les gradients locaux ∇E_i(X*) ne sont pas nuls", "Parce que le pas est trop petit", "Parce que les données sont mélangées"],
      bonne: 1, explication: "Au minimiseur, le gradient total est nul, mais pas les gradients locaux : chaque pas déplace encore le point." },
    { enonce: "Avec une descente par lots de taille K = N, on retrouve…", bloom: "Appliquer", slide: 13,
      choix: ["La descente stochastique", "La recherche linéaire", "La descente de gradient classique", "La méthode de Newton"],
      bonne: 2, explication: "K = 1 donne la descente stochastique, K = N la descente classique." }
  ];
  const cartes = [
    { recto: "Formule de mise à jour de la descente stochastique", verso: "X_{k+1} = X_k − ρ ∇E_i(X_k)" },
    { recto: "Conditions d'un pas décroissant convergent", verso: "Σ ρ_k = +∞ et Σ ρ_k² < +∞" },
    { recto: "Taille de lot K usuelle en apprentissage profond", verso: "32, 64, 128… (batch_size)" }
  ];

  let i = 0, bonnes = 0; const aRevoir = [];
  const $ = id => document.getElementById(id);

  function afficherQuestion() {
    const q = questions[i];
    $("compteur").textContent = `Question ${i + 1} / ${questions.length}`;
    $("bloom").textContent = q.bloom;
    $("barre").style.width = `${(i / questions.length) * 100}%`;
    $("enonce").textContent = q.enonce;
    $("source").textContent = `Source : [Slide ${q.slide}]`;
    $("feedback").className = "feedback";
    $("suivant").disabled = true;
    $("choix").innerHTML = "";
    q.choix.forEach((texte, n) => {
      const b = document.createElement("button");
      b.textContent = texte;
      b.addEventListener("click", () => repondre(n));
      $("choix").appendChild(b);
    });
  }

  function repondre(n) {
    const q = questions[i];
    const boutons = [...$("choix").children];
    boutons.forEach(b => (b.disabled = true));
    boutons[q.bonne].classList.add("bonne");
    const juste = n === q.bonne;
    if (juste) bonnes++; else { boutons[n].classList.add("mauvaise"); aRevoir.push(`${q.enonce} [Slide ${q.slide}]`); }
    $("feedback").className = `feedback visible ${juste ? "ok" : "ko"}`;
    $("feedback").innerHTML = `<strong>${juste ? "Bonne réponse !" : "Pas tout à fait."}</strong> ${q.explication}`;
    $("suivant").disabled = false;
    $("suivant").textContent = i === questions.length - 1 ? "Voir le score" : "Question suivante →";
  }

  $("suivant").addEventListener("click", () => {
    i++;
    if (i < questions.length) return afficherQuestion();
    $("barre").style.width = "100%";
    $("qcm").style.display = "none";
    $("score").style.display = "block";
    $("valeur").textContent = `${bonnes} / ${questions.length}`;
    $("revoir").innerHTML = aRevoir.length ? aRevoir.map(t => `<li>${t}</li>`).join("") : "<li>Aucune, bravo !</li>";
  });
  $("recommencer").addEventListener("click", () => {
    i = 0; bonnes = 0; aRevoir.length = 0;
    $("score").style.display = "none"; $("qcm").style.display = "flex"; afficherQuestion();
  });

  // Flashcards
  let c = 0, verso = false;
  function afficherCarte() {
    $("face").textContent = verso ? "Verso" : "Recto";
    $("contenu").textContent = verso ? cartes[c].verso : cartes[c].recto;
    $("compteur-cartes").textContent = `Carte ${c + 1} / ${cartes.length}`;
  }
  $("carte").addEventListener("click", () => { verso = !verso; afficherCarte(); });
  document.querySelectorAll(".evaluation button").forEach(b =>
    b.addEventListener("click", () => { c = (c + 1) % cartes.length; verso = false; afficherCarte(); }));

  // Bascule QCM / Flashcards
  document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => {
    const flash = b.dataset.mode === "flashcards";
    document.querySelectorAll(".modes button").forEach(x => x.classList.toggle("actif", x === b));
    $("flashcards").style.display = flash ? "flex" : "none";
    $("qcm").style.display = flash ? "none" : "flex";
    $("score").style.display = "none";
    ["compteur", "bloom"].forEach(id => ($(id).style.visibility = flash ? "hidden" : "visible"));
    document.querySelector(".progression").style.visibility = flash ? "hidden" : "visible";
    if (!flash) { i = 0; bonnes = 0; aRevoir.length = 0; afficherQuestion(); }
  }));

  afficherQuestion();
  afficherCarte();
</script>
</body>
</html>
