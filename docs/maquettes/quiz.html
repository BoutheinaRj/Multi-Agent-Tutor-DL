<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette D2 — Page Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="maquettes.css">
</head>
<body>
<!-- D2 — Maquette de la page Quiz (pour Ali, A5) : une question à la fois, feedback immédiat,
     score final, mode flashcards. Données d'exemple : cours ml_gradient_stochastique_esprit_fr. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-livre" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7"/></symbol>
  <symbol id="i-cours" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-quiz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-tuteur" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-ko" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-droite" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-recommencer" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
  <symbol id="i-cartes" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></symbol>
</svg>

<header class="barre">
  <a class="marque" href="cours.html">
    <span class="marque-logo"><svg class="icone"><use href="#i-tuteur"/></svg></span>
    <span class="marque-nom">Tutor</span>
  </a>
  <div class="fil">
    <svg class="icone"><use href="#i-livre"/></svg>
    <span>Optimisation pour le ML</span><span>›</span>
    <strong>Ch. 3 — Descente de gradient stochastique</strong>
  </div>
  <nav class="onglets">
    <a href="cours.html"><svg class="icone"><use href="#i-cours"/></svg>Cours</a>
    <a href="quiz.html" class="actif"><svg class="icone"><use href="#i-quiz"/></svg>Quiz</a>
  </nav>
  <span class="avatar" title="Étudiant">OA</span>
</header>

<main class="page-quiz">
  <div class="titre-quiz">
    <div>
      <h1>Vérifiez vos acquis</h1>
      <p>Chapitre 3 · questions générées à partir des slides du cours</p>
    </div>
    <div class="segment" role="group" aria-label="Mode">
      <button data-mode="qcm" class="actif">QCM</button>
      <button data-mode="flashcards">Flashcards</button>
    </div>
  </div>
  <div class="etapes" id="etapes"></div>

  <!-- QCM : une question à la fois, feedback immédiat -->
  <section class="carte question" id="qcm">
    <div class="meta-question">
      <span class="compteur" id="compteur"></span>
      <span class="pastille ambre" id="bloom"></span>
    </div>
    <h2 id="enonce"></h2>
    <div class="choix" id="choix"></div>
    <div class="feedback" id="feedback"></div>
    <div class="pied-quiz">
      <span class="note" id="source"></span>
      <button class="bouton primaire" id="suivant" disabled>Question suivante<svg class="icone"><use href="#i-droite"/></svg></button>
    </div>
  </section>

  <!-- Score final -->
  <section class="carte score" id="score">
    <div class="anneau" id="anneau"><div id="valeur"></div></div>
    <h2 id="message-score"></h2>
    <p class="note">Questions à revoir, avec la slide où retrouver la réponse :</p>
    <div class="a-revoir" id="revoir"></div>
    <div class="actions">
      <button class="bouton" id="recommencer"><svg class="icone"><use href="#i-recommencer"/></svg>Recommencer</button>
      <button class="bouton"><svg class="icone"><use href="#i-cartes"/></svg>Réviser en flashcards</button>
      <button class="bouton primaire"><svg class="icone"><use href="#i-export"/></svg>Exporter vers Anki</button>
    </div>
  </section>

  <!-- Flashcards : recto / verso, auto-évaluation (SM-2, A6) -->
  <section class="flashcards" id="flashcards">
    <div class="scene">
      <div class="flashcard" id="carte" title="Cliquer pour retourner">
        <div class="face recto"><span class="etiquette-face">Question</span><span class="contenu" id="recto"></span><span class="note">Cliquez pour voir la réponse</span></div>
        <div class="face verso"><span class="etiquette-face">Réponse</span><span class="contenu" id="verso"></span></div>
      </div>
    </div>
    <p class="note" id="compteur-cartes"></p>
    <div class="evaluation">
      <button class="bouton">À revoir<small>&lt; 1 min</small></button>
      <button class="bouton">Difficile<small>6 min</small></button>
      <button class="bouton">Bien<small>1 jour</small></button>
      <button class="bouton primaire">Facile<small style="color:rgba(255,255,255,.75)">4 jours</small></button>
    </div>
  </section>
</main>

<script>
  // Format proche de la sortie de l'agent Quiz (A2).
  const questions = [
    { enonce: "Qu'est-ce qu'une époque (epoch) ?", bloom: "Mémoriser", slide: 3,
      choix: ["Une mise à jour des paramètres", "Un passage complet sur les N données", "Le choix du pas ρ", "Le tirage aléatoire d'une donnée"],
      bonne: 1, explication: "Une itération est une mise à jour des paramètres ; une époque est un passage complet sur les N données." },
    { enonce: "Pourquoi la descente stochastique à pas constant oscille-t-elle autour du minimiseur X* ?", bloom: "Comprendre", slide: 7,
      choix: ["Parce que ∇E(X*) ≠ 0", "Parce que les gradients locaux ∇Eᵢ(X*) ne sont pas nuls", "Parce que le pas est trop petit", "Parce que les données sont mélangées"],
      bonne: 1, explication: "Au minimiseur, le gradient total est nul, mais pas les gradients locaux : chaque pas déplace encore le point." },
    { enonce: "Avec une descente par lots de taille K = N, on retrouve…", bloom: "Appliquer", slide: 13,
      choix: ["La descente stochastique", "La recherche linéaire", "La descente de gradient classique", "La méthode de Newton"],
      bonne: 2, explication: "K = 1 donne la descente stochastique ; K = N, la descente de gradient classique." }
  ];
  const cartes = [
    { recto: "Formule de mise à jour de la descente stochastique", verso: "Xₖ₊₁ = Xₖ − ρ ∇Eᵢ(Xₖ)" },
    { recto: "Conditions d'un pas décroissant qui converge", verso: "Σ ρₖ = +∞  et  Σ ρₖ² < +∞" },
    { recto: "Tailles de lot usuelles en apprentissage profond", verso: "32, 64, 128… (batch_size)" }
  ];

  const $ = id => document.getElementById(id);
  let i = 0, bonnes = 0; const resultats = []; const aRevoir = [];

  function dessinerEtapes() {
    $("etapes").innerHTML = questions.map((_, n) =>
      `<span class="${n < resultats.length ? (resultats[n] ? "juste" : "fausse") : n === i ? "faite" : ""}"></span>`).join("");
  }
  function afficherQuestion() {
    const q = questions[i];
    $("compteur").textContent = `Question ${i + 1} sur ${questions.length}`;
    $("bloom").textContent = q.bloom;
    $("enonce").textContent = q.enonce;
    $("source").textContent = `Source : Slide ${q.slide}`;
    $("feedback").className = "feedback";
    $("suivant").disabled = true;
    $("choix").innerHTML = "";
    q.choix.forEach((texte, n) => {
      const b = document.createElement("button");
      b.innerHTML = `<span class="lettre">${"ABCD"[n]}</span><span>${texte}</span>`;
      b.addEventListener("click", () => repondre(n));
      $("choix").appendChild(b);
    });
    dessinerEtapes();
  }
  function repondre(n) {
    const q = questions[i];
    const boutons = [...$("choix").children];
    boutons.forEach(b => (b.disabled = true));
    boutons[q.bonne].classList.add("bonne");
    const juste = n === q.bonne;
    resultats.push(juste);
    if (juste) bonnes++; else { boutons[n].classList.add("mauvaise"); aRevoir.push(q); }
    $("feedback").className = `feedback visible ${juste ? "ok" : "ko"}`;
    $("feedback").innerHTML = `<span class="icone-retour"><svg class="icone"><use href="#i-${juste ? "ok" : "ko"}"/></svg></span>` +
      `<p><strong>${juste ? "Bonne réponse." : "Pas tout à fait."}</strong> ${q.explication}</p>`;
    $("suivant").disabled = false;
    $("suivant").firstChild.textContent = i === questions.length - 1 ? "Voir mon score" : "Question suivante";
    dessinerEtapes();
  }
  $("suivant").addEventListener("click", () => {
    i++;
    if (i < questions.length) return afficherQuestion();
    $("qcm").style.display = "none";
    $("score").style.display = "flex";
    const pct = Math.round((bonnes / questions.length) * 100);
    $("anneau").style.setProperty("--p", pct);
    $("valeur").textContent = `${bonnes}/${questions.length}`;
    $("message-score").textContent = pct === 100 ? "Parfait, tout est acquis !" : pct >= 60 ? "Bien joué, encore un petit effort" : "À retravailler";
    $("revoir").innerHTML = aRevoir.length
      ? aRevoir.map(q => `<div>${q.enonce} <a class="source" href="cours.html">Slide ${q.slide}</a></div>`).join("")
      : "<div>Aucune question à revoir.</div>";
  });
  function recommencer() {
    i = 0; bonnes = 0; resultats.length = 0; aRevoir.length = 0;
    $("score").style.display = "none"; $("qcm").style.display = "flex"; afficherQuestion();
  }
  $("recommencer").addEventListener("click", recommencer);

  // Flashcards
  let c = 0;
  function afficherCarte() {
    $("carte").classList.remove("retournee");
    $("recto").textContent = cartes[c].recto;
    $("verso").textContent = cartes[c].verso;
    $("compteur-cartes").textContent = `Carte ${c + 1} sur ${cartes.length}`;
  }
  $("carte").addEventListener("click", () => $("carte").classList.toggle("retournee"));
  document.querySelectorAll(".evaluation button").forEach(b =>
    b.addEventListener("click", () => { c = (c + 1) % cartes.length; afficherCarte(); }));

  // Bascule QCM / Flashcards
  document.querySelectorAll(".segment button").forEach(b => b.addEventListener("click", () => {
    const flash = b.dataset.mode === "flashcards";
    document.querySelectorAll(".segment button").forEach(x => x.classList.toggle("actif", x === b));
    $("flashcards").style.display = flash ? "flex" : "none";
    $("etapes").style.visibility = flash ? "hidden" : "visible";
    if (flash) { $("qcm").style.display = "none"; $("score").style.display = "none"; } else recommencer();
  }));

  afficherQuestion();
  afficherCarte();
</script>
</body>
</html>
